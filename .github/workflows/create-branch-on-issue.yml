name: Create Branch on Issue

on:\n  issues:\n    types: [opened]\n\njobs:\n  create-branch:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Sanitize issue title\n        id: sanitize\n        run: |\n          BRANCH_NAME=$(echo "${{ github.event.issue.title }}" | tr [:upper:] [:lower:] | tr -cs a-z0-9 - | sed s/^-//
